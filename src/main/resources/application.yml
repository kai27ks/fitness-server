spring:
  application:
    name: jianshenfang
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 25MB        # 原图上限 20MB，留余量
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  # 会员 / 教练「我的」页底部的技术支持入口；修改后重启，管理员不展示
  support:
    enabled: ${SUPPORT_ENABLED:true}
    title: 系统维护与技术支持
    description: 使用问题反馈、功能建议或系统开发维护咨询，欢迎联系。
    developer-name: ${SUPPORT_DEVELOPER_NAME:}
    phone: ${SUPPORT_PHONE:15805080815}
    email: ${SUPPORT_EMAIL:kai27ks@163.com}
  package:
    # 课包到期前 N 天提示「即将到期」，可按需调整
    expiring-days: 7
  moments:
    enabled: true                     # 风采功能总开关（与下面两个审核开关无关）
    # ===== 两个审核开关：彼此独立，改完重启生效 =====
    machine-audit-enabled: false      # 开关① 机器审核：true=逐张调用腾讯云 IMS；false=完全跳过、不发 HTTP
    need-review: true                 # 开关② 人工审核：true=进待审队列；false=不进队列
    # 四种组合：
    #   机审开 + 人审开：机审通过后待管理员审核，通过才展示
    #   机审开 + 人审关：机审通过即展示；判定违规的那张仍单独打回
    #   机审关 + 人审开：直接进入待审核队列
    #   机审关 + 人审关：上传成功立即在风采广场展示，无需任何审核
    upload-dir: ./upload/moments     # 生产在 application-prod.yml 覆盖为 /opt/fitness/upload/moments
    url-prefix: /upload/moments
    max-source-bytes: 20971520       # 原图 > 20 MB 直接拒绝
    max-source-pixels: 40000000      # 4000 万像素，防图片炸弹
    max-edge: 1920
    min-edge: 1280
    thumb-edge: 640
    thumb-max-bytes: 153600          # 缩略图 ≤ 150 KB
    jpeg-quality: 0.82
    min-jpeg-quality: 0.70
    max-output-bytes: 1048576        # 压缩后 ≤ 1 MB
    daily-limit: 4
    title-max-length: 200
    comment-max-length: 200
    comment-max-per-minute: 10       # 0 表示不限制
    # ===== 腾讯云图片内容安全（天御 IMS）连接参数（开关在上方，不在这里） =====
    # 机审开启但未填密钥时会降级跳过并输出告警，后续按「人审开关」决定入队或立即展示
    audit:
      enabled: false                  # 兼容旧开关：与 machine-audit-enabled 任一为 true 即开启机审
      endpoint: ims.tencentcloudapi.com
      region: ap-guangzhou
      version: '2020-12-29'
      action: ImageModeration
      secret-id: ''                  # TODO 腾讯云 API 密钥 SecretId（勿入库，用环境变量覆盖）
      secret-key: ''                 # TODO 腾讯云 API 密钥 SecretKey
      biz-type: ''                   # 可选：天御控制台创建的业务策略 BizType
      timeout-ms: 5000
      fail-open: true                # 机审异常时放行，转人工审核；false 则拒绝上传
      review-as-reject: false        # 腾讯云返回 Review 时：false=转人工复核，true=直接打回

# ===== 微信公众号网页授权 =====
# 生产用环境变量 WX_APPID / WX_SECRET 覆盖；勿把密钥写进仓库
wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  scope: snsapi_userinfo
  # 微信回调可达的后端域名，必须与公众号后台「网页授权域名」一致
  callback-base-url: ${WX_CALLBACK_BASE_URL:http://localhost:8080}
  # 授权完成后 302 回会员端 H5
  h5-base-url: ${WX_H5_BASE_URL:http://localhost:5173}
  mock: false                       # 生产必须为 false
  state-ttl-seconds: 300
  ticket-ttl-seconds: 120
  claim-ticket-ttl-seconds: 600
  claim-code-expire-days: 7
  claim-code-max-fail: 5
  avatar-upload-dir: ./upload/avatars
  avatar-url-prefix: /upload/avatars

  # ===== 预约通知（Q9~Q11）=====
  # 公众号后台「服务器配置」的 Token，用于事件推送验签
  token: ${WX_TOKEN:}
  # 引导关注页展示的公众号二维码图片地址（可为空，为空只显示文字引导）
  qrcode-url: ${WX_QRCODE_URL:}
  notify-enabled: true
  # 模板 ID 从公众号后台「模板库」选用后填入；为空则该场景自动跳过，不发请求
  templates:
    BOOKING_CREATED: ${WX_TPL_BOOKING_CREATED:}
    BOOKING_CANCELED: ${WX_TPL_BOOKING_CANCELED:}
    BOOKING_REMINDER: ${WX_TPL_BOOKING_REMINDER:}
  reminder-hours: 24              # Q11：提前 24 小时
  reminder-window-minutes: 60     # 扫描窗口，dedup_key 保证只发一次
  mock-follow-required: false     # 生产保持 false
